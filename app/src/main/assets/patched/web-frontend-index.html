  /* ---- CSS `inset` 简写（Chrome 87）---------------------------------------
   * [dsh-mobile-inset-shim] —— 这个字面量是 applyAssetPatch 的补丁代次标记：
   * 老版本铺过的 index.html 不带它，升级后才会被重铺（否则新补丁永远上不去）。
   * 本机 WebView 是 Chromium 83，解析不了 `inset` 简写（Chrome 87 才有）——整条声明
   * 被丢掉，于是 dsh 里所有 `position:fixed; inset:0` 的弹层都回落到 static position：
   *   · 设置面板跑到屏幕外/被裁掉 → 「点开设置划不到底、自定义提供方配不了 API Key」
   *   · 生图弹窗、输入框覆盖层同理（position:absolute; inset:0）
   * CSS 属性没法在运行时 polyfill，但可以在样式文本进引擎之前把简写展开成
   * top/right/bottom/left 四条。只在引擎真的不支持时才装。

    // 都不能碰（前者是自定义属性，后两者不是简写）。
    var RE = /(^|[;{\s])inset\s*:\s*([^;{}"']+)/g;

    /** 按顶层空白切分（calc(...) / var(...) 里的空格不算分隔符）。 */

          continue;

  /* ---- 移动端窄屏布局（手机壳专用）[dsh-mobile-mobile-css] [dsh-mobile-composer] -----------------
   * 设置面板在手机上原来只有 300px 宽（= 侧栏抽屉宽度），中文被挤成一字一行、
   * 按钮文字折行，看起来像乱码。两个原因：
   *   ① 抽屉 `._3HOSdG_mobileDrawer` 带 transform（即使是单位矩阵），会让

   *   ② dsh 面板 CSS 依赖 `inset: 0`，Chromium 83 解析不了（见上面的 inset shim）；

   *

   * 在当前内核下没有被注册（dsh.client 声明缺 inject 字段），写在那里是死代码。
   * 本文件由壳在 onPageStarted/onPageFinished 注入，且已内联进首页，必定生效。

      '    top: 0 !important; right: 0 !important; bottom: 0 !important; left: 0 !important;',
      '    padding: 0 !important;',
      '  }',

      '    display: flex !important; align-items: center !important; gap: 10px !important;',

      '    flex: 1 1 auto !important; min-height: 0 !important;',
      '    width: 100% !important; max-width: 100% !important; box-sizing: border-box !important;',

      '    max-width: 100% !important; min-width: 0 !important;',

      '    flex: 1 1 auto !important; min-width: 0 !important;',
      '    gap: 6px !important; justify-content: flex-end !important;',

      '  [class*=Sh0Q9G_trigger] {',
      '    min-width: 30px !important; width: 30px !important; height: 30px !important;',
      '    padding: 0 !important; border-radius: 15px !important;',
      '  }',
      '  [class*=Sh0Q9G_triggerLabel] { display: none !important; }',
      '  [class*=Sh0Q9G_triggerIcon] { margin: 0 auto !important; }',
      // 模型按钮：可压缩，文字省略号（不硬截断）
      '  [class*=_7KE1Ra_trigger] {',
      '    flex: 0 1 auto !important; min-width: 0 !important; max-width: none !important;',
      '    height: 30px !important; padding: 0 8px !important;',
      '  }',
      '  [class*=_7KE1Ra_triggerLabel] {',
      '    overflow: hidden !important; text-overflow: ellipsis !important;',
      '    white-space: nowrap !important; min-width: 0 !important;',
      '  }',
      '  [class*=_7KE1Ra_triggerEffort] { flex: 0 0 auto !important; }',
